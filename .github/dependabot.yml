version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      development:
        applies-to: version-updates
        patterns:
          - '@cloudflare/vite-plugin'
          - '@cloudflare/vitest-plugin'
          - cf
          - prettier
          - typescript
          - vite
          - vitest
        update-types:
          - minor
          - patch
      production:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
